name: Deploy Treemoa Worker
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'migrations/treemoa/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: treemoa-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - run: npm ci
      - name: Check Worker syntax
        run: node --check worker/index.js
      - name: Create only treemoa tables and migration history
        run: npm run db:migrate:remote
      - name: Deploy treemoa Worker
        run: npm run worker:deploy > treemoa-deploy.log 2>&1 || { cat treemoa-deploy.log; exit 1; }
      - name: Verify D1 schema through Worker
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const output = readFileSync('treemoa-deploy.log','utf8');
          const base = output.match(/https:\/\/treemoa\.[a-z0-9-]+\.workers\.dev/gi)?.at(-1);
          if (!base) throw Error('Worker URL missing from deploy output');
          const response = await fetch(base + '/api/health', {signal: AbortSignal.timeout(20000)});
          const health = await response.json();
          if (!response.ok || health.service !== 'treemoa' || health.database !== 'ready') throw Error('Treemoa schema is not ready');
          console.log(base, health);
          JS
