name: One-time delete all Actions artifacts

on:
  push:
    paths:
      - .github/workflows/purge-actions-artifacts-once.yml

permissions:
  contents: read
  actions: write

jobs:
  delete-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete every Actions artifact in this repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deleted=0
          for pass in $(seq 1 100); do
            ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&page=1" --jq '.artifacts[].id')"
            if [[ -z "$ids" ]]; then
              echo "Completed: deleted $deleted artifacts from $GITHUB_REPOSITORY."
              echo "Deleted $deleted artifacts from $GITHUB_REPOSITORY." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            while IFS= read -r id; do
              [[ -n "$id" ]] || continue
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null
              deleted=$((deleted+1))
            done <<< "$ids"
          done
          echo "Stopped after 100 passes; some artifacts may remain" >&2
          exit 1
