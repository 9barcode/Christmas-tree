name: Build Release AIT

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ait.yml'
      - 'src/**'
      - 'assets/**'
      - 'index.html'
      - 'scripts/build-web.mjs'
      - 'asset-cache-worker.js'
      - 'scripts/api-config.mjs'
      - 'apps-in-toss.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      app_name:
        description: '앱인토스 콘솔에 등록한 앱 이름(appName)'
        required: true
        default: christmas-tree-decorating
        type: string

permissions:
  contents: read

jobs:
  ait:
    name: Release AIT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Release builds use the verified Treemoa origin if the optional variable is empty.
      - name: Build production AIT with validated API origin
        run: npm run build:toss
        env:
          TREE_API_BASE_URL: ${{ vars.TREE_API_BASE_URL }}
          NODE_ENV: production
          TOSS_APP_NAME: ${{ inputs.app_name || 'christmas-tree-decorating' }}
      - uses: actions/upload-artifact@v4
        with:
          name: christmas-tree-release-ait-${{ github.sha }}
          path: '*.ait'
          if-no-files-found: error
          retention-days: 14
