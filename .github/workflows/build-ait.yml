name: Build Release AIT

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: '앱인토스 콘솔에 등록한 앱 이름(appName)'
        required: true
        default: christmas-tree
        type: string

permissions:
  contents: read

jobs:
  ait:
    name: Release AIT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build production AIT
        run: npm run build:toss
        env:
          NODE_ENV: production
          TOSS_APP_NAME: ${{ inputs.app_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: christmas-tree-release-ait-${{ github.sha }}
          path: '*.ait'
          if-no-files-found: error
          retention-days: 14
